<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="img/icono.ico">
  <title>Detalle del Producto - ToteArt</title>  
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-client.js"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- =========================================================================
       BARRA DE NAVEGACIÓN SUPERIOR
       ========================================================================= -->
  <header class="header-wrapper">
    <div class="header-container">
      <a href="index.html" class="brand-logo" aria-label="Ir a página de inicio de ToteArt">
        <img src="img/Logo ToteArt.jpeg" data-img-type="logo" onerror="handleImgFallback(this)" alt="">
        <span>ToteArt</span>
      </a>

      <div class="header-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar tote bag bordado..." aria-label="Buscar tote bag bordado">
      </div>

      <nav class="header-nav" aria-label="Navegación principal">
        <a href="lista.html" class="nav-link" id="navWishlistBtn">Mi Lista (<span id="wishlistCountNav">0</span>)</a>
        <a href="pedidos.html" class="nav-link" id="navOrdersBtn">Mis Pedidos (<span id="ordersCountNav">0</span>)</a>
        <a href="carrito.html" class="cart-btn" title="Ver Carrito de compras" aria-label="Ver carrito de compras">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C3A21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cartBadgeCount" aria-label="Artículos en carrito">0</span>
        </a>
        <button class="login-header-btn" id="loginHeaderBtn" onclick="window.location.href='login.html'">
          Iniciar sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- =========================================================================
       CONTENIDO PRINCIPAL: FICHA DE PRODUCTO (PDP)
       ========================================================================= -->
  <main class="main-wrapper" id="view-pdp">
    <a href="catalogo.html" class="back-link" style="display:inline-block; text-decoration:none; margin-bottom:16px;">
      ← Volver al catálogo
    </a>

    <div class="pdp-card">
      <div class="pdp-gallery-box">
        <img id="pdpImage" src="" alt="" onerror="handleImgFallback(this)">
      </div>

      <div class="pdp-details">
        <span class="pdp-collection-tag" id="pdpCategory">COLECCIÓN ANIMALES</span>
        <h1 class="pdp-title" id="pdpTitle">Cargando producto...</h1>
        <div class="pdp-rating">
          <span style="color:#D97706" aria-hidden="true">★</span>
          <span id="pdpRatingText" style="font-weight:600; color:var(--text-main);">4.8</span>
          <button type="button" class="btn-link-reviews" onclick="document.getElementById('pdpReviewsContainer').scrollIntoView({ behavior: 'smooth' })">
            Ver reseñas
          </button>
        </div>
        <div class="pdp-price" id="pdpPrice" style="color: #2D5A43; font-weight: 700;">$0.00 USD</div>
        <div class="product-stock" id="pdpStock" style="margin-bottom: 14px;">
          <p class="stock-text" style="color: #5A3E2D; font-weight: 500; margin: 0;">
            <strong style="color: #5A3E2D;">Disponibles:</strong> <strong style="color: #2D5A43;">0</strong>
          </p>
        </div>
        <p class="pdp-desc" id="pdpDesc">
          Cargando descripción detallada...
        </p>

        <div class="quantity-control">
          <span class="quantity-label" id="qtyLabel">Cantidad:</span>
          <div class="qty-counter" role="group" aria-labelledby="qtyLabel">
            <button type="button" id="pdpQtyMinus" onclick="modifyQty(-1)" aria-label="Disminuir cantidad">-</button>
            <span id="pdpQtyVal" aria-live="polite">1</span>
            <button type="button" id="pdpQtyPlus" onclick="modifyQty(1)" aria-label="Aumentar cantidad">+</button>
          </div>
        </div>

        <div class="pdp-actions">
          <button class="btn-pdp-primary" id="btnAddToCartPdp" onclick="addCurrentProductToCart(event)">
            Añadir al carrito
          </button>
          <button class="btn-pdp-buy" id="btnBuyNowPdp" onclick="handleBuyNow()">
            Comprar ahora
          </button>
          <button class="btn-pdp-wishlist" id="pdpWishlistToggleBtn" onclick="toggleWishlist()">
            + Guardar en mi lista
          </button>
        </div>
      </div>
    </div>

    <!-- Sección de recomendaciones dinámicas por categoría (Carrusel Gestalt de 6 productos) -->
    <section class="section-header" style="margin-top: 40px;" aria-labelledby="relatedHeading">
      <h2 class="section-title" id="relatedHeading" style="font-size: 18px;">También te podría interesar</h2>
    </section>
    <div class="carousel-wrapper">
      <button type="button" class="carousel-arrow-btn prev" aria-label="Desplazar recomendados a la izquierda" onclick="document.getElementById('pdpRelatedGrid').scrollBy({ left: -300, behavior: 'smooth' })">←</button>
      <div class="carousel-track" id="pdpRelatedGrid">
        <!-- Renderizado dinámico de 5 a 6 productos de la misma categoría -->
      </div>
      <button type="button" class="carousel-arrow-btn next" aria-label="Desplazar recomendados a la derecha" onclick="document.getElementById('pdpRelatedGrid').scrollBy({ left: 300, behavior: 'smooth' })">→</button>
    </div>

    <!-- Bloque inferior de Reseñas y Calificación en el PDP (#pdpReviewsContainer) -->
    <section id="pdpReviewsContainer" class="reviews-section-card" aria-labelledby="pdpReviewsHeading">
      <div class="reviews-header-row">
        <div>
          <h2 class="section-title" id="pdpReviewsHeading" style="font-size: 18px; margin-bottom: 4px;">Reseñas de clientes</h2>
          <div class="product-rating" style="margin-bottom: 0;">
            <span class="star" style="color:#D97706" aria-hidden="true">★</span>
            <span id="pdpReviewsAvgText">4.8</span>
          </div>
        </div>
      </div>

      <!-- Lista de comentarios registrados -->
      <div id="pdpReviewsList" class="reviews-list-container">
        <p class="reviews-empty-text">Este diseño aún no tiene comentarios escritos.</p>
      </div>

      <!-- Bloque de calificación para el usuario (condicionado a compra verificada) -->
      <div id="pdpUserReviewBlock" style="margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--border);">
        <!-- Renderizado dinámico según si compró o no el producto -->
      </div>
    </section>
  </main>

  <script>
    let currentProduct = null;
    let currentQty = 1;
    let pdpSelectedStar = 5;

    function getPdpMaxQty() {
      if (!currentProduct) return 0;
      const inCart = (getStoredCart().find(i => i.product && String(i.product.id) === String(currentProduct.id)) || {}).quantity || 0;
      return Math.max(0, getAvailableStock(currentProduct.id) - inCart);
    }

    function updatePdpStockUI() {
      if (!currentProduct) return;
      const stock = getAvailableStock(currentProduct.id);
      const maxQty = getPdpMaxQty();
      if (maxQty > 0 && currentQty > maxQty) currentQty = maxQty;
      if (currentQty < 1) currentQty = 1;

      const qtyElem = document.getElementById('pdpQtyVal');
      if (qtyElem) qtyElem.textContent = maxQty > 0 ? currentQty : 0;
      const stockContainer = document.getElementById('pdpStock');
      if (stockContainer) {
        if (stock > 0) {
          stockContainer.innerHTML = `<p class="stock-text" style="color: #5A3E2D; font-weight: 500; margin: 0;"><strong style="color: #5A3E2D;">Disponibles:</strong> <strong style="color: #2D5A43;">${stock}</strong></p>`;
        } else {
          stockContainer.innerHTML = `<p class="stock-text" style="margin: 0;"><strong style="color: #DC2626;">No disponible</strong></p>`;
        }
      }

      const plusBtn = document.getElementById('pdpQtyPlus');
      const minusBtn = document.getElementById('pdpQtyMinus');
      if (plusBtn) plusBtn.disabled = maxQty <= 0 || currentQty >= maxQty;
      if (minusBtn) minusBtn.disabled = maxQty <= 0 || currentQty <= 1;

      const addBtn = document.getElementById('btnAddToCartPdp');
      const buyBtn = document.getElementById('btnBuyNowPdp');
      const soldOut = stock <= 0;
      const limitReached = !soldOut && maxQty <= 0;
      if (addBtn) {
        addBtn.disabled = soldOut || limitReached;
        addBtn.textContent = 'Añadir al carrito';
      }
      if (buyBtn) {
        buyBtn.disabled = soldOut || limitReached;
        buyBtn.textContent = 'Comprar ahora';
      }
    }

    function modifyQty(delta) {
      const maxQty = getPdpMaxQty();
      currentQty = Math.min(Math.max(1, currentQty + delta), Math.max(1, maxQty));
      updatePdpStockUI();
    }

    function addCurrentProductToCart(event) {
      if (!currentProduct) return;
      if (currentQty > getPdpMaxQty()) { updatePdpStockUI(); return; }

      let cart = getStoredCart();
      const existing = cart.find(item => item.product && String(item.product.id) === String(currentProduct.id));

      if (existing) {
        existing.quantity = (existing.quantity || 1) + currentQty;
      } else {
        cart.push({ product: currentProduct, quantity: currentQty });
      }

      cart = cart.filter(item => item && item.product && item.quantity > 0);
      saveCart(cart);
      updateBadges();

      const btn = document.getElementById('btnAddToCartPdp');
      showButtonNotification(btn, "✓ Añadido al carrito", 'cart');
      currentQty = 1;
      updatePdpStockUI();
    }

    function handleBuyNow() {
      if (!currentProduct) return;
      if (currentQty > getPdpMaxQty()) { updatePdpStockUI(); return; }

      let cart = getStoredCart();
      const existing = cart.find(item => item.product && String(item.product.id) === String(currentProduct.id));
      if (existing) {
        existing.quantity = (existing.quantity || 1) + currentQty;
      } else {
        cart.push({ product: currentProduct, quantity: currentQty });
      }
      cart = cart.filter(item => item && item.product && item.quantity > 0);
      saveCart(cart);
      updateBadges();

      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html?redirect=checkout.html';
      } else {
        window.location.href = 'checkout.html';
      }
    }

    async function toggleWishlist() {
      if (!currentProduct) return;

      const inWish = await toggleFavorite(currentProduct.id);
      if (inWish === null) return; // sin sesión: toggleFavorite ya mostró el aviso

      updateBadges();
      updateWishlistButtonUI(inWish);

      const btn = document.getElementById('pdpWishlistToggleBtn');
      const msg = inWish ? "♥ Guardado en mi lista" : "Eliminado de mi lista";
      showButtonNotification(btn, msg, 'wishlist');
    }

    function updateWishlistButtonUI(inWish) {
      const btn = document.getElementById('pdpWishlistToggleBtn');
      if (btn) {
        btn.textContent = inWish ? "✓ Guardado en mi lista" : "+ Guardar en mi lista";
      }
    }

    function escapeHtmlPdp(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function selectPdpStar(starVal) {
      pdpSelectedStar = Math.min(5, Math.max(1, Number(starVal) || 5));
      document.querySelectorAll('#pdpStarSelector .star-select-btn').forEach(btn => {
        const val = Number(btn.getAttribute('data-star'));
        btn.classList.toggle('active', val <= pdpSelectedStar);
      });
      const label = document.getElementById('pdpStarValueLabel');
      if (label) {
        label.textContent = `${pdpSelectedStar} de 5 ${pdpSelectedStar === 1 ? 'estrella' : 'estrellas'}`;
      }
    }

    async function handlePdpReviewSubmit(e) {
      e.preventDefault();
      if (!currentProduct) return;
      const textarea = document.getElementById('pdpReviewTextarea');
      const comentarioRaw = textarea ? textarea.value.trim() : '';
      const comentario = comentarioRaw.length > 0 ? comentarioRaw : null;

      const btn = document.getElementById('btnPdpPublishReview');
      if (btn) {
        btn.disabled = true;
        btn.textContent = 'Publicando...';
      }

      await submitProductReview({
        productId: currentProduct.id,
        calificacion: pdpSelectedStar,
        comentario: comentario
      });

      await renderPdpReviewsSection();
    }

    async function renderPdpReviewsSection() {
      if (!currentProduct) return;
      const listEl = document.getElementById('pdpReviewsList');
      const userBlockEl = document.getElementById('pdpUserReviewBlock');
      const ratingElem = document.getElementById('pdpRatingText');
      const reviewsAvgEl = document.getElementById('pdpReviewsAvgText');

      const reviews = (typeof fetchReviewsFromDatabase === 'function')
        ? await fetchReviewsFromDatabase(currentProduct.id)
        : [];

      const summary = (typeof getProductRatingSummary === 'function')
        ? getProductRatingSummary(currentProduct.id)
        : { text: (currentProduct.rating || 4.8).toFixed(1) };

      if (ratingElem) ratingElem.textContent = summary.text;
      if (reviewsAvgEl) reviewsAvgEl.textContent = summary.text;

      // 1. Mostrar tarjetas compactas de reseñas o mensaje cuando no hay comentarios escritos
      const writtenReviews = (reviews || []).filter(r => r && String(r.comentario || '').trim().length > 0);
      if (listEl) {
        if (writtenReviews.length === 0) {
          listEl.innerHTML = `<p class="reviews-empty-text">Este diseño aún no tiene comentarios escritos.</p>`;
        } else {
          listEl.innerHTML = writtenReviews.map(r => {
            const stars = '★'.repeat(Math.min(5, Math.max(1, Number(r.calificacion) || 5)));
            const dateStr = r.fecha_resena
              ? new Date(r.fecha_resena).toLocaleDateString('es-EC', { day: '2-digit', month: 'short', year: 'numeric' })
              : '';
            return `
              <article class="review-card-item">
                <div class="review-item-header">
                  <div>
                    <strong class="review-author-name">${escapeHtmlPdp(r.nombre_cliente || r.id_cliente || 'Comprador verificado')}</strong>
                    <span class="review-verified-tag">Compra verificada</span>
                  </div>
                  <span class="review-item-date">${escapeHtmlPdp(dateStr)}</span>
                </div>
                <div class="review-item-stars" style="color:#D97706" aria-label="${Number(r.calificacion) || 5} de 5 estrellas">${stars}</div>
                <p class="review-item-comment">${escapeHtmlPdp(r.comentario)}</p>
              </article>
            `;
          }).join('');
        }
      }

      // 2. Verificar si el usuario actual compró este producto (pedidos + detalle_pedidos)
      if (userBlockEl) {
        const purchased = (typeof hasClientPurchasedProduct === 'function')
          ? await hasClientPurchasedProduct(currentProduct.id)
          : false;

        if (purchased) {
          pdpSelectedStar = 5;
          userBlockEl.innerHTML = `
            <form class="review-form-box" style="margin-top:0;" onsubmit="handlePdpReviewSubmit(event)">
              <h3 style="font-size:16px; font-weight:700; color:var(--brand); margin-bottom:12px;">Califica este producto</h3>
              <div class="form-group">
                <div class="star-selector" id="pdpStarSelector" role="radiogroup" aria-label="Califica de 1 a 5 estrellas">
                  <button type="button" class="star-select-btn active" data-star="1" onclick="selectPdpStar(1)" aria-label="1 estrella">★</button>
                  <button type="button" class="star-select-btn active" data-star="2" onclick="selectPdpStar(2)" aria-label="2 estrellas">★</button>
                  <button type="button" class="star-select-btn active" data-star="3" onclick="selectPdpStar(3)" aria-label="3 estrellas">★</button>
                  <button type="button" class="star-select-btn active" data-star="4" onclick="selectPdpStar(4)" aria-label="4 estrellas">★</button>
                  <button type="button" class="star-select-btn active" data-star="5" onclick="selectPdpStar(5)" aria-label="5 estrellas">★</button>
                  <span class="star-selector-label" id="pdpStarValueLabel">5 de 5 estrellas</span>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="pdpReviewTextarea">¿Deseas dejar un comentario? (opcional)</label>
                <textarea class="form-control" id="pdpReviewTextarea" rows="3" placeholder="Cuéntanos qué te pareció el bordado..."></textarea>
              </div>
              <button type="submit" class="btn-checkout-primary" id="btnPdpPublishReview" style="width:auto; padding:10px 22px;">
                Publicar reseña
              </button>
            </form>
          `;
        } else {
          userBlockEl.innerHTML = `
            <div class="review-verify-msg" role="status" style="margin-top:0;">
              Solo compradores verificados de este diseño pueden dejar un comentario.
            </div>
          `;
        }
      }
    }

    function renderPdpRecommendations() {
      const relatedGrid = document.getElementById('pdpRelatedGrid');
      if (!relatedGrid || !currentProduct) return;
      const list = window.PRODUCTS || PRODUCTS || [];

      // Obtener productos de la misma categoría excluyendo el actual
      const related = list.filter(p =>
        p.category === currentProduct.category && String(p.id) !== String(currentProduct.id)
      );
      // Tomar 5 o 6 al azar o en orden rotativo
      const recommendations = related.sort(() => 0.5 - Math.random()).slice(0, 6);
      relatedGrid.innerHTML = recommendations.map(p => createAccessibleProductCardHtml(p)).join('');
    }

    window.selectPdpProductById = function(prodId) {
      const list = window.PRODUCTS || PRODUCTS || [];
      if (!list.length) return;
      const found = list.find(p => String(p.id) === String(prodId));
      if (!found) return;

      const url = new URL(window.location);
      url.searchParams.set('id', found.id);
      window.history.pushState({}, '', url);

      initPdpViewFromProducts(found.id);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    function initPdpViewFromProducts(overrideId) {
      const list = window.PRODUCTS || PRODUCTS || [];
      if (!list.length) return;

      const params = new URLSearchParams(window.location.search);
      const prodId = overrideId || params.get('id') || 'totoro';

      currentProduct = list.find(p => String(p.id) === String(prodId)) || list[0];
      window.currentPdpProduct = currentProduct;
      currentQty = 1;

      document.title = `${currentProduct.title} - ToteArt`;
      const imgElem = document.getElementById('pdpImage');
      if (imgElem) {
        const exactImg = typeof resolveExactImgFile === 'function'
          ? resolveExactImgFile(currentProduct.imgFile, currentProduct.title, currentProduct.id)
          : currentProduct.imgFile;
        imgElem.removeAttribute('data-fallback-step');
        imgElem.src = `img/${exactImg}`;
        imgElem.alt = currentProduct.altText || currentProduct.title;
      }
      const catElem = document.getElementById('pdpCategory');
      if (catElem) catElem.textContent = (currentProduct.categoryLabel || '').toUpperCase();
      const titleElem = document.getElementById('pdpTitle');
      if (titleElem) titleElem.textContent = currentProduct.title;

      const ratingElem = document.getElementById('pdpRatingText');
      if (ratingElem) {
        ratingElem.setAttribute('data-rating-text-for', currentProduct.id);
        ratingElem.textContent = typeof getProductRatingSummary === 'function'
          ? getProductRatingSummary(currentProduct.id).text
          : (currentProduct.rating || 4.8).toFixed(1);
      }

      const priceElem = document.getElementById('pdpPrice');
      if (priceElem) priceElem.textContent = `$${currentProduct.price.toFixed(2)} USD`;
      updatePdpStockUI();
      refreshStockFromDatabase([currentProduct.id]).then(updatePdpStockUI);
      const descElem = document.getElementById('pdpDesc');
      if (descElem) descElem.textContent = currentProduct.desc;

      // Estado botón lista
      const wishlist = getStoredWishlist();
      const inWish = wishlist.some(p => String(p.id) === String(currentProduct.id));
      updateWishlistButtonUI(inWish);

      // Recomendados dinámicos por categoría (5 a 6 productos)
      renderPdpRecommendations();

      // Cargar y renderizar reseñas en #pdpReviewsContainer
      renderPdpReviewsSection();
    }

    document.addEventListener('DOMContentLoaded', () => {
      initPdpViewFromProducts();
      // Sincronizar estado del botón de favoritos con Supabase
      if (typeof syncWishlistFromCloud === 'function') {
        syncWishlistFromCloud().then(list => {
          if (currentProduct) {
            updateWishlistButtonUI(list.some(p => String(p.id) === String(currentProduct.id)));
          }
        }).catch(() => {});
      }
    });
  </script>
</body>
</html>
