<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi Perfil - ToteArt</title>  
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- =========================================================================
       BARRA DE NAVEGACIÓN SUPERIOR
       ========================================================================= -->
  <header class="header-wrapper">
    <div class="header-container">
      <a href="index.html" class="brand-logo" aria-label="Ir a página de inicio de ToteArt">
        <img src="img/Logo ToteArt.jpeg" data-img-type="logo" onerror="handleImgFallback(this)" alt="">
        <span>ToteArt</span>
      </a>

      <div class="header-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar tote bag bordado..." aria-label="Buscar tote bag bordado">
      </div>

      <nav class="header-nav" aria-label="Navegación principal">
        <a href="catalogo.html" class="nav-link">Catálogo</a>
        <a href="pedidos.html" class="nav-link" id="navOrdersBtn">Mis Pedidos</a>
        <a href="carrito.html" class="cart-btn" title="Ver Carrito de compras" aria-label="Ver carrito de compras">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C3A21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cartBadgeCount" aria-label="Artículos en carrito">0</span>
        </a>
        <button class="login-header-btn" id="loginHeaderBtn" onclick="window.location.href='perfil.html'">
          Mi Cuenta
        </button>
      </nav>
    </div>
  </header>

  <!-- =========================================================================
       CONTENIDO PRINCIPAL: GESTIÓN DE PERFIL
       ========================================================================= -->
  <main class="main-wrapper">
    <div style="max-width: 520px; margin: 30px auto;">
      <a href="catalogo.html" class="back-link" style="display:inline-block; text-decoration:none; margin-bottom:16px;">
        ← Volver al catálogo
      </a>

      <div class="auth-card">
        <h1 class="auth-card-title" style="font-size: 22px;">Mi Cuenta</h1>
        <p class="auth-card-desc">Gestiona tus datos de acceso y seguridad.</p>

        <div id="profileAlert" role="alert" style="display:none; padding:10px 14px; background:#DEF7EC; color:#03543F; border-radius:6px; font-size:13px; margin-bottom:16px; font-weight:600;">
          ✓ Datos actualizados correctamente.
        </div>

        <form id="profileForm" onsubmit="handleUpdateProfile(event)">
          <div class="form-group">
            <label class="form-label" for="profileName">Nombre completo</label>
            <input type="text" class="form-control" id="profileName" name="name" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="profileEmail">Correo electrónico *</label>
            <input type="email" class="form-control" id="profileEmail" name="email" required autocomplete="email">
          </div>

          <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">

          <h2 style="font-size:15px; font-weight:700; color:var(--text-main); margin-bottom:12px;">Cambiar Contraseña</h2>

          <div class="form-group">
            <label class="form-label" for="profileCurrentPass">Contraseña actual</label>
            <input type="password" class="form-control" id="profileCurrentPass" name="currentPassword" placeholder="••••••••" autocomplete="current-password">
          </div>

          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="profileNewPass">Nueva contraseña</label>
            <input type="password" class="form-control" id="profileNewPass" name="newPassword" minlength="6" placeholder="Dejar en blanco si no deseas cambiarla" autocomplete="new-password">
          </div>

          <div style="display:flex; flex-direction:column; gap:10px;">
            <button type="submit" class="btn-checkout-primary">
              Guardar Cambios
            </button>
            <button type="button" class="btn-pdp-wishlist" style="padding:10px;" onclick="handleLogout()">
              Cerrar Sesión
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'login.html?redirect=perfil.html';
        return;
      }

      document.getElementById('profileName').value = user.nombre || 'Paula Morales';
      document.getElementById('profileEmail').value = user.email || 'paula.morales@correo.com';
    });

    function handleUpdateProfile(e) {
      e.preventDefault();
      const name = document.getElementById('profileName').value.trim();
      const email = document.getElementById('profileEmail').value.trim();

      const user = {
        nombre: name,
        email: email
      };
      setCurrentUser(user);
      updateBadges();

      const alertBox = document.getElementById('profileAlert');
      if (alertBox) {
        alertBox.style.display = 'block';
        setTimeout(() => {
          alertBox.style.display = 'none';
        }, 3000);
      }
    }

    function handleLogout() {
      setCurrentUser(null);
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
