<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/x-icon" href="img/icono.ico">
  <title>ToteArt - Tienda Online de Tote Bags Bordados a Mano</title>  
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <!-- =========================================================================
       BARRA DE NAVEGACIÓN SUPERIOR
       ========================================================================= -->
  <header class="header-wrapper">
    <div class="header-container">
      <a href="index.html" class="brand-logo" aria-label="Ir a página de inicio de ToteArt">
        <img src="img/Logo ToteArt.jpeg" data-img-type="logo" onerror="handleImgFallback(this)" alt="">
        <span>ToteArt</span>
      </a>

      <div class="header-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <label for="searchInput" class="sr-only" style="position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); border:0;">Buscar bolsos</label>
        <input type="text" id="searchInput" placeholder="Buscar tote bag bordado..." aria-label="Buscar tote bag bordado">
      </div>

      <nav class="header-nav" aria-label="Navegación principal">
        <a href="lista.html" class="nav-link" id="navWishlistBtn">Mi Lista (<span id="wishlistCountNav">0</span>)</a>
        <a href="pedidos.html" class="nav-link" id="navOrdersBtn">Mis Pedidos (<span id="ordersCountNav">0</span>)</a>
        <a href="carrito.html" class="cart-btn" title="Ver Carrito de compras" aria-label="Ver carrito de compras">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C3A21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cartBadgeCount" aria-label="Artículos en carrito">0</span>
        </a>
        <button class="login-header-btn" id="loginHeaderBtn" onclick="window.location.href='login.html'">
          Iniciar sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- =========================================================================
       CONTENIDO PRINCIPAL
       ========================================================================= -->
  <main class="main-wrapper">

    <!-- A. HERO BANNER -->
    <section class="home-hero-container" aria-label="Promoción principal">
      <img src="img/header home.jpeg" alt="Detalles que llevas contigo - Colección de bolsos bordados artesanales ToteArt" class="home-hero-banner">
    </section>

    <!-- B. SECCIÓN EXPLORA POR CATEGORÍA -->
    <section aria-labelledby="cat-heading">
      <div class="home-section-header">
        <h2 class="home-section-title" id="cat-heading">Explora por categoría</h2>
        <a href="catalogo.html" class="home-section-link">Ver todas →</a>
      </div>
      <div class="home-categories-grid">
        <a href="catalogo.html?cat=flores" class="category-home-card" style="text-decoration:none; color:inherit;">
          <div class="category-avatar-circle">
            <img src="img/Tote con arreglo floral.jpeg" alt="" class="category-circle-img">
          </div>
          <div class="category-home-info">
            <div class="category-home-title">Flores</div>
            <span class="category-home-link">Ver colección →</span>
          </div>
        </a>
        <a href="catalogo.html?cat=animales" class="category-home-card" style="text-decoration:none; color:inherit;">
          <div class="category-avatar-circle">
            <img src="img/Tote de zorro otoñal.jpeg" alt="" class="category-circle-img">
          </div>
          <div class="category-home-info">
            <div class="category-home-title">Animales</div>
            <span class="category-home-link">Ver colección →</span>
          </div>
        </a>
        <a href="catalogo.html?cat=personajes" class="category-home-card" style="text-decoration:none; color:inherit;">
          <div class="category-avatar-circle">
            <img src="img/Tote de Mi vecino Totoro.jpeg" alt="" class="category-circle-img">
          </div>
          <div class="category-home-info">
            <div class="category-home-title">Personajes animados</div>
            <span class="category-home-link">Ver colección →</span>
          </div>
        </a>
      </div>
    </section>

    <!-- C. SECCIÓN MÁS VENDIDOS (CARRUSEL GESTALT) -->
    <section aria-labelledby="bestsellers-heading">
      <div class="home-section-header">
        <h2 class="home-section-title" id="bestsellers-heading">Más vendidos</h2>
        <a href="catalogo.html" class="home-section-link">Ver todos →</a>
      </div>
      <div class="carousel-wrapper">
        <button type="button" class="carousel-arrow-btn prev" aria-label="Desplazar Más vendidos a la izquierda" onclick="document.getElementById('homeBestsellersGrid').scrollBy({ left: -300, behavior: 'smooth' })">←</button>
        <div class="carousel-track" id="homeBestsellersGrid">
          <!-- Generado dinámicamente desde Supabase -->
        </div>
        <button type="button" class="carousel-arrow-btn next" aria-label="Desplazar Más vendidos a la derecha" onclick="document.getElementById('homeBestsellersGrid').scrollBy({ left: 300, behavior: 'smooth' })">→</button>
      </div>
    </section>

    <!-- D. SECCIÓN DESCUBRE NUESTRA COLECCIÓN (CARRUSEL GESTALT) -->
    <section aria-labelledby="collection-heading">
      <div class="home-section-header">
        <h2 class="home-section-title" id="collection-heading">Descubre nuestra colección</h2>
        <a href="catalogo.html" class="home-section-link">Ver catálogo →</a>
      </div>
      <div class="carousel-wrapper">
        <button type="button" class="carousel-arrow-btn prev" aria-label="Desplazar colección a la izquierda" onclick="document.getElementById('homeCollectionGrid').scrollBy({ left: -300, behavior: 'smooth' })">←</button>
        <div class="carousel-track" id="homeCollectionGrid">
          <!-- Generado dinámicamente desde Supabase -->
        </div>
        <button type="button" class="carousel-arrow-btn next" aria-label="Desplazar colección a la derecha" onclick="document.getElementById('homeCollectionGrid').scrollBy({ left: 300, behavior: 'smooth' })">→</button>
      </div>
    </section>

    <!-- E. FRANJA ARTESANAL -->
    <div style="margin-top: 40px; height: 74px; overflow: hidden; border-radius: var(--radius-md); display: flex; align-items: center;">
      <img src="img/footer home.jpeg" alt="Diseños bordados a mano sobre algodón 100% natural" class="home-craft-banner" style="margin-bottom: 0; height: 130px; object-fit: cover; object-position: center 50%;">
    </div>

  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (typeof renderCatalog === 'function') {
        renderCatalog();
      }
    });
  </script>
</body>
</html>
