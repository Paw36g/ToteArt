<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión - ToteArt</title>  
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- =========================================================================
       BARRA DE NAVEGACIÓN SUPERIOR
       ========================================================================= -->
  <header class="header-wrapper">
    <div class="header-container">
      <a href="index.html" class="brand-logo" aria-label="Ir a página de inicio de ToteArt">
        <img src="img/Logo ToteArt.jpeg" data-img-type="logo" onerror="handleImgFallback(this)" alt="">
        <span>ToteArt</span>
      </a>

      <div class="header-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar tote bag bordado..." aria-label="Buscar tote bag bordado">
      </div>

      <nav class="header-nav" aria-label="Navegación principal">
        <a href="catalogo.html" class="nav-link">Catálogo</a>
        <a href="pedidos.html" class="nav-link" id="navOrdersBtn">Mis Pedidos</a>
        <a href="carrito.html" class="cart-btn" title="Ver Carrito de compras" aria-label="Ver carrito de compras">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C3A21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cartBadgeCount" aria-label="Artículos en carrito">0</span>
        </a>
        <button class="login-header-btn" id="loginHeaderBtn" onclick="window.location.href='login.html'">
          Iniciar sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- =========================================================================
       CONTENIDO PRINCIPAL: INICIAR SESIÓN
       ========================================================================= -->
  <main class="main-wrapper">
    <div style="max-width: 480px; margin: 30px auto;">
      <a href="catalogo.html" class="back-link" style="display:inline-block; text-decoration:none; margin-bottom:16px;">
        ← Volver al catálogo
      </a>

      <div class="auth-card">
        <h1 class="auth-card-title" style="font-size: 22px; text-align: center;">Iniciar Sesión</h1>
        <p class="auth-card-desc" style="text-align: center;">Accede a tu cuenta de ToteArt para completar tu compra y gestionar tus pedidos.</p>

        <form id="loginForm" onsubmit="handleLogin(event)">
          <div class="form-group">
            <label class="form-label" for="loginEmail">Correo electrónico *</label>
            <input type="email" class="form-control" id="loginEmail" name="email" required placeholder="tu@correo.com" value="paula.morales@correo.com" autocomplete="email">
          </div>

          <div class="form-group" style="margin-bottom: 24px;">
            <label class="form-label" for="loginPassword">Contraseña *</label>
            <input type="password" class="form-control" id="loginPassword" name="password" required placeholder="Ingresa tu contraseña" value="12345678" autocomplete="current-password">
          </div>

          <button type="submit" class="btn-checkout-primary" style="width: 100%;">
            Iniciar sesión
          </button>
        </form>

        <p style="text-align:center; font-size:13px; margin-top:20px;">
          ¿No tienes una cuenta?
          <a href="registro.html" id="registerRedirectLink" style="color:var(--primary); font-weight:600; text-decoration:none;">
            Regístrate aquí
          </a>
        </p>
      </div>
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');
      if (redirect) {
        const regLink = document.getElementById('registerRedirectLink');
        if (regLink) {
          regLink.href = `registro.html?redirect=${encodeURIComponent(redirect)}`;
        }
      }
    });

    function handleLogin(e) {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();

      // Guardar sesión del usuario simulada
      let existingUser = getCurrentUser();
      if (!existingUser || existingUser.email !== email) {
        existingUser = {
          nombre: "Paula Morales",
          email: email
        };
      }
      setCurrentUser(existingUser);
      updateBadges();

      const params = new URLSearchParams(window.location.search);
      const redirect = params.get('redirect');

      if (redirect) {
        window.location.href = redirect;
      } else {
        window.location.href = 'catalogo.html';
      }
    }
  </script>
</body>
</html>
