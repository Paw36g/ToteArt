<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mis Pedidos - ToteArt</title>  
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>

  <!-- =========================================================================
       BARRA DE NAVEGACIÓN SUPERIOR
       ========================================================================= -->
  <header class="header-wrapper">
    <div class="header-container">
      <a href="index.html" class="brand-logo" aria-label="Ir a página de inicio de ToteArt">
        <img src="img/Logo ToteArt.jpeg" data-img-type="logo" onerror="handleImgFallback(this)" alt="">
        <span>ToteArt</span>
      </a>

      <div class="header-search">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <input type="text" id="searchInput" placeholder="Buscar tote bag bordado..." aria-label="Buscar tote bag bordado">
      </div>

      <nav class="header-nav" aria-label="Navegación principal">
        <a href="catalogo.html" class="nav-link">Catálogo</a>
        <a href="pedidos.html" class="nav-link active" id="navOrdersBtn">Mis Pedidos</a>
        <a href="carrito.html" class="cart-btn" title="Ver Carrito de compras" aria-label="Ver carrito de compras">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C3A21" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="9" cy="21" r="1"></circle>
            <circle cx="20" cy="21" r="1"></circle>
            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
          </svg>
          <span class="cart-badge" id="cartBadgeCount" aria-label="Artículos en carrito">0</span>
        </a>
        <button class="login-header-btn" id="loginHeaderBtn" onclick="window.location.href='login.html'">
          Iniciar sesión
        </button>
      </nav>
    </div>
  </header>

  <!-- =========================================================================
       CONTENIDO PRINCIPAL: HISTORIAL Y TRACKING DE PEDIDOS
       ========================================================================= -->
  <main class="main-wrapper">
    <a href="catalogo.html" class="back-link" style="display:inline-block; text-decoration:none; margin-bottom:16px;">
      ← Volver al catálogo
    </a>

    <!-- Banner de confirmación para compra recién realizada -->
    <div id="orderSuccessBanner" style="display:none; margin-bottom: 24px;"></div>

    <h1 class="page-title">Historial y Estado de Pedidos</h1>

    <div id="trackingContentWrap">
      <!-- Renderizado dinámico vía JS -->
    </div>
  </main>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      renderOrdersView();
    });

    function renderOrdersView() {
      const wrap = document.getElementById('trackingContentWrap');
      let orders = getStoredOrders();

      const params = new URLSearchParams(window.location.search);
      const isNew = params.get('new') === 'true';
      const orderIdParam = params.get('orderId');

      // Si no hay pedidos pero acabamos de confirmar uno, o si no hay ninguno en absoluto
      if (orders.length === 0) {
        wrap.innerHTML = `
          <div class="empty-state-card">
            <div class="empty-icon-circle" aria-hidden="true">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#7A7067" stroke-width="2">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
                <line x1="8" y1="21" x2="16" y2="21"></line>
                <line x1="12" y1="17" x2="12" y2="21"></line>
              </svg>
            </div>
            <h2 class="empty-state-title" style="font-size:20px;">Aún no tienes pedidos registrados</h2>
            <p class="empty-state-desc">Cuando realices una compra, podrás ver aquí el seguimiento paso a paso de tu entrega.</p>
            <a href="catalogo.html" class="btn-checkout-primary" style="margin: 0 auto; max-width: 220px; display:inline-block; text-decoration:none; text-align:center;">
              Explorar catálogo
            </a>
          </div>
        `;
        return;
      }

      const activeOrder = orders[0];

      // Banner de éxito si la compra es reciente
      if (isNew) {
        const successBanner = document.getElementById('orderSuccessBanner');
        if (successBanner) {
          successBanner.style.display = 'block';
          successBanner.innerHTML = `
            <div class="empty-state-card" style="max-width: 100%; text-align: left; padding: 24px 28px; background: #DEF7EC; border: 1px solid #31C48D;">
              <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 8px;">
                <div style="width:36px; height:36px; border-radius:50%; background:#03543F; color:white; display:flex; align-items:center; justify-content:center; font-weight:700;">
                  ✓
                </div>
                <div>
                  <h2 style="font-size: 18px; font-weight: 700; color: #03543F; margin:0;">
                    ¡Muchas gracias por tu compra${activeOrder.customerName ? ', ' + activeOrder.customerName : ''}!
                  </h2>
                  <p style="font-size: 13px; color: #046C4E; margin:0;">
                    Tu pedido con código <strong>${activeOrder.code}</strong> ha sido confirmado con éxito.
                  </p>
                </div>
              </div>
            </div>
          `;
        }
      }

      wrap.innerHTML = `
        <!-- Stepper del Pedido -->
        <div class="tracking-stepper-box">
          <div class="tracking-header-bar">
            <span>Pedido ${activeOrder.code} | Fecha: ${activeOrder.date} | Total: $${activeOrder.total} USD</span>
            <span class="tracking-badge-registered">Registrado</span>
          </div>

          <p style="font-size: 11px; font-weight: 700; letter-spacing: 0.8px; color: var(--text-muted); text-transform: uppercase; margin-bottom: 24px;">
            ESTADO ACTUAL DE LA ORDEN:
          </p>

          <div class="stepper-container">
            <div class="stepper-line"></div>

            <!-- Paso 1 -->
            <div class="step-node completed">
              <div class="step-circle" aria-hidden="true">✓</div>
              <div class="step-title">1. Pedido Registrado</div>
              <div class="step-time" style="color:var(--primary); font-weight:600;">${activeOrder.date} 10:15</div>
            </div>

            <!-- Paso 2 -->
            <div class="step-node">
              <div class="step-circle" aria-hidden="true">2</div>
              <div class="step-title">2. Bordado en Taller</div>
              <div class="step-time">Pendiente</div>
            </div>

            <!-- Paso 3 -->
            <div class="step-node">
              <div class="step-circle" aria-hidden="true">3</div>
              <div class="step-title">3. ${activeOrder.deliveryMethod === 'envio' ? 'Enviado / En Tránsito' : 'Listo para Retiro'}</div>
              <div class="step-time">Pendiente</div>
            </div>

            <!-- Paso 4 -->
            <div class="step-node">
              <div class="step-circle" aria-hidden="true">4</div>
              <div class="step-title">${activeOrder.deliveryMethod === 'envio' ? 'Entregado' : 'Retirado'}</div>
              <div class="step-time">Estimado: 3-5 días</div>
            </div>
          </div>
        </div>

        <!-- Detalles de Envío -->
        <div class="checkout-section-box" style="margin-bottom: 24px;">
          <h2 style="font-size: 15px; font-weight: 700; margin-bottom: 12px;">Detalles de Entrega:</h2>
          ${activeOrder.deliveryMethod === 'envio' ? `
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">
              <strong>Transportadora:</strong> Servientrega (Guía pendiente de generación tras etapa de bordado).
            </p>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">
              <strong>Dirección de destino:</strong> Av. Amazonas N34-120 y Gaspar de Villarroel, Quito, Pichincha.
            </p>
            <p style="font-size: 13px; color: var(--text-muted);">
              <strong>Estado actual:</strong> Tu orden ha sido registrada. La guía de Servientrega se generará al finalizar la confección en taller.
            </p>
          ` : `
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">
              <strong>Modalidad:</strong> Retiro personal en taller ToteArt.
            </p>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 6px;">
              <strong>Dirección de retiro:</strong> Taller ToteArt – Av. Amazonas N34-120 y Gaspar de Villarroel, Quito.
            </p>
            <p style="font-size: 13px; color: var(--text-muted);">
              <strong>Estado actual:</strong> Tu orden ha sido registrada. Te avisaremos cuando tu pedido esté listo para retirar en local.
            </p>
          `}
        </div>

        <!-- Resumen de Productos Comprados -->
        <div class="checkout-section-box">
          <h2 style="font-size: 15px; font-weight: 700; margin-bottom: 16px;">Resumen de Productos Comprados:</h2>
          <div id="trackingPurchasedItemsList">
            ${activeOrder.items.map((item, index) => `
              <div class="cart-product-cell" style="padding: 12px 0; ${index < activeOrder.items.length - 1 ? 'border-bottom: 1px solid var(--border);' : ''}">
                <div class="cart-product-thumb">
                  <img src="img/${item.product.imgFile}" alt="${item.product.altText || item.product.title}" onerror="handleImgFallback(this)">
                </div>
                <div style="flex: 1;">
                  <div class="cart-product-title">
                    <a href="producto.html?id=${encodeURIComponent(item.product.id)}" style="color:inherit; text-decoration:none;">
                      ${item.product.title} (x${item.quantity})
                    </a>
                  </div>
                  <div class="cart-product-specs">${item.product.categoryLabel} • ${item.product.specs || 'Algodón crudo'}</div>
                </div>
                <div style="font-weight:700; font-size:15px; color:var(--text-main);">
                  $${(item.product.price * item.quantity).toFixed(2)} USD
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
